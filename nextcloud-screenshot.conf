# Nextcloud screenshot upload config
# Fill these in, then: chmod 600 ~/.config/hypr/nextcloud-screenshot.conf
#
# NEXTCLOUD_URL: base URL of your Nextcloud instance, no trailing slash
#   e.g. https://cloud.example.com
NEXTCLOUD_URL=""
#
# NEXTCLOUD_USER: your Nextcloud username
NEXTCLOUD_USER=""
#
# NEXTCLOUD_APP_PASSWORD is no longer stored here.
# Generate one at Nextcloud Settings -> Security -> "Create new app password",
# then store it in KWallet (run this yourself, in your own terminal):
#   kwallet-query -f hypr -w nextcloud-screenshot-app-password kdewallet
# (it reads the password from stdin/prompt; nothing is written to disk in the clear)
#
# Folder screenshots get uploaded to (created automatically if missing)
NEXTCLOUD_FOLDER="/Screenshots"
